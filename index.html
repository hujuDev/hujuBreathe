<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>huju Breathe</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="favicon.ico" type="image/x-icon" />
  </head>
  <body>
    <div class="container">
      <button id="settings-button" class="settings-button" title="Settings">⚙</button>
      <h1>huju Breathe</h1>
      <div id="shapes" class="shapes">
        <div class="hexagon"></div>
        <div class="hexagon"></div>
        <div class="hexagon"></div>
        <div class="hexagon"></div>
        <div id="counter" class="counter"></div>
      </div>
      <div id="phase-timer" class="phase-timer"></div>
      <div id="breath-display" class="breath-display">Breaths: 30 • Rounds: 3 • Retention: 90s • Hold: 15s</div>
      <div id="status" class="status">Ready</div>
      <form id="settings-form">
        <div id="settings-panel">
          <div class="form-group">
            <label>Pick a Base Color:</label>
            <div class="color-picker">
              <span class="color-option selected" data-color="#4AAFF7" style="background-color: #4AAFF7;"></span>
              <span class="color-option" data-color="#20B2AA" style="background-color: #20B2AA;"></span>
              <span class="color-option" data-color="#8A2BE2" style="background-color: #8A2BE2;"></span>
              <span class="color-option" data-color="#FF7F50" style="background-color: #FF7F50;"></span>
              <span class="color-option" data-color="#32CD32" style="background-color: #32CD32;"></span>
            </div>
          </div>
          <div class="form-group">
            <label for="inhale">Inhale Duration (seconds):</label>
            <input type="number" id="inhale" name="inhale" value="1.8" min="0.1" step="0.1" />
          </div>
          <div class="form-group">
            <label for="exhale">Exhale Duration (seconds):</label>
            <input type="number" id="exhale" name="exhale" value="1.8" min="0.1" step="0.1" />
          </div>
          <div class="form-group">
            <label for="retention">Retention Duration (seconds):</label>
            <input type="number" id="retention" name="retention" value="90" min="0" step="1" />
          </div>
          <div class="form-group">
            <label for="hold">Breath Hold Duration (seconds):</label>
            <input type="number" id="hold" name="hold" value="15" min="0" step="1" />
          </div>
          <div class="form-group">
            <label for="breaths">Number of Breaths per Round:</label>
            <input type="number" id="breaths" name="breaths" value="30" min="1" />
          </div>
          <div class="form-group">
            <label for="rounds">Number of Rounds:</label>
            <input type="number" id="rounds" name="rounds" value="3" min="1" />
          </div>
          <div class="form-group">
            <label>
              <input type="checkbox" id="background-sound-toggle" checked /> Enable Background Sound
            </label>
            <label for="background-volume">Volume:</label>
            <input type="range" id="background-volume" name="background-volume" min="0" max="1" step="0.05" value="0.1">
            <span id="volume-display">10%</span> <!-- Optional: Display current volume -->
          </div>
          <div class="form-group">
            <label>
              <input type="checkbox" id="breath-sound-toggle" checked /> Enable Breath Sounds
            </label>
          </div>
          <button type="button" id="reset-defaults-button">Reset to Default</button>
        </div>
        <div class="buttons">
          <button type="submit" id="start-button">Start Breathing</button>
          <button type="button" id="pause-button" disabled>Pause</button>
          <button type="button" id="reset-button" disabled>Reset</button>
        </div>
      </form>
    </div>

    <!-- Audio Elements -->
    <audio id="background-audio" src="background.mp3" loop></audio>
    <audio id="inhale-audio" src="inhale.mp3"></audio>
    <audio id="exhale-audio" src="exhale.mp3"></audio>

    <script src="script.js"></script>

    <!-- SVG Definition for Rounded Hexagon Clip Path -->
    <svg width="0" height="0" style="position: absolute;">
      <defs>
        <clipPath id="rounded-hexagon-clip" clipPathUnits="objectBoundingBox">
          <!-- Path definition for a hexagon with rounded corners -->
          <!-- Adjust 'A' radius (e.g., 0.04, 0.04) for more/less rounding -->
          <path d="M 0.284 0.067 L 0.716 0.067 A 0.05 0.05 0 0 1 0.759 0.091 L 0.975 0.476 A 0.05 0.05 0 0 1 0.975 0.524 L 0.759 0.909 A 0.05 0.05 0 0 1 0.716 0.933 L 0.284 0.933 A 0.05 0.05 0 0 1 0.241 0.909 L 0.025 0.524 A 0.05 0.05 0 0 1 0.025 0.476 L 0.241 0.091 A 0.05 0.05 0 0 1 0.284 0.067 Z" />
        </clipPath>
      </defs>
    </svg>
  </body>
</html>
